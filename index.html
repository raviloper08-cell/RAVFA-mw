<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,
maximum-scale=1,user-scalable=no,
viewport-fit=cover">

<title>RAVFMA WM</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090909;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#menu{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,#292929 0,#111 42%,#050505 100%);
  color:white;
}

.logo{
  font-size:52px;
  font-weight:1000;
  letter-spacing:5px;
  color:#fff;
  text-shadow:
    0 0 15px rgba(255,255,255,.18),
    0 0 35px rgba(255,190,40,.15);
}

.logo span{
  color:#e3b23c;
}

.subtitle{
  margin-top:7px;
  color:#999;
  font-size:13px;
  letter-spacing:5px;
}

.menuButtons{
  margin-top:55px;
  width:min(82vw,330px);
  display:flex;
  flex-direction:column;
  gap:13px;
}

button{
  border:0;
  outline:0;
  color:white;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:15px;
  padding:17px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.mainButton{
  color:#111;
  background:#e3b23c;
  border-color:#e3b23c;
  box-shadow:0 7px 25px rgba(227,178,60,.18);
}

.menuRecord{
  margin-top:27px;
  color:#777;
  font-size:14px;
}

.menuRecord b{
  color:#e3b23c;
}

#hud{
  position:fixed;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 15px);
  left:16px;
  right:16px;
  display:none;
  justify-content:space-between;
  pointer-events:none;
}

.hudBox{
  min-width:100px;
  padding:9px 13px;
  border-radius:13px;
  background:rgba(10,10,10,.68);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);
}

.hudLabel{
  color:#777;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:2px;
}

.hudValue{
  color:#fff;
  font-size:20px;
  font-weight:900;
  margin-top:2px;
}

#backButton{
  position:fixed;
  z-index:6;
  top:calc(env(safe-area-inset-top) + 15px);
  right:16px;
  display:none;
  width:43px;
  height:43px;
  padding:0;
  border-radius:50%;
  font-size:20px;
  background:rgba(10,10,10,.7);
}

#gameOver{
  position:fixed;
  z-index:20;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.gameOverBox{
  width:min(86vw,350px);
  padding:30px 22px;
  text-align:center;
  border-radius:23px;
  background:#151515;
  border:1px solid #303030;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.gameOverTitle{
  color:#e3b23c;
  font-size:31px;
  font-weight:1000;
}

.gameOverScore{
  margin-top:18px;
  color:#aaa;
  font-size:14px;
}

.gameOverScore strong{
  display:block;
  margin-top:5px;
  color:#fff;
  font-size:38px;
}

.newGame{
  margin-top:24px;
  width:100%;
  color:#111;
  background:#e3b23c;
}

.menuAgain{
  margin-top:10px;
  width:100%;
}

#mobileControls{
  position:fixed;
  z-index:8;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  display:none;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.controlSide{
  display:flex;
  gap:12px;
  pointer-events:auto;
}

.control{
  width:62px;
  height:62px;
  padding:0;
  border-radius:50%;
  background:rgba(20,20,20,.68);
  border:1px solid rgba(255,255,255,.14);
  color:white;
  font-size:24px;
  backdrop-filter:blur(8px);
}

.jump{
  width:76px;
  height:76px;
  color:#111;
  background:#e3b23c;
  border-color:#e3b23c;
  font-size:27px;
}

#loading{
  position:fixed;
  z-index:100;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#090909;
  color:white;
}

.loadingLogo{
  font-size:42px;
  font-weight:1000;
  letter-spacing:4px;
}

.loadingLogo span{
  color:#e3b23c;
}

.loadingText{
  margin-top:12px;
  color:#777;
  font-size:12px;
  letter-spacing:4px;
}

.loaderLine{
  width:130px;
  height:3px;
  margin-top:25px;
  overflow:hidden;
  border-radius:5px;
  background:#222;
}

.loaderProgress{
  width:45%;
  height:100%;
  background:#e3b23c;
  animation:load 1.1s infinite ease-in-out;
}

@keyframes load{
  0%{transform:translateX(-150%)}
  100%{transform:translateX(350%)}
}
</style>
</head>

<body>

<div id="loading">
  <div class="loadingLogo">RAVFMA <span>WM</span></div>
  <div class="loadingText">ЗАГРУЗКА</div>
  <div class="loaderLine">
    <div class="loaderProgress"></div>
  </div>
</div>

<canvas id="game"></canvas>

<div id="menu">

  <div class="logo">
    RAVFMA <span>WM</span>
  </div>

  <div class="subtitle">
    VERTICAL RUN
  </div>

  <div class="menuButtons">
    <button class="mainButton" onclick="startGame()">
      НАЧАТЬ ИГРУ
    </button>

    <button onclick="resetRecord()">
      СБРОСИТЬ РЕКОРД
    </button>
  </div>

  <div class="menuRecord">
    РЕКОРД: <b id="menuRecord">0</b>
  </div>

</div>

<div id="hud">

  <div class="hudBox">
    <div class="hudLabel">Счёт</div>
    <div class="hudValue" id="score">0</div>
  </div>

  <div class="hudBox">
    <div class="hudLabel">Монеты</div>
    <div class="hudValue" id="coins">0</div>
  </div>

</div>

<button id="backButton" onclick="goMenu()">×</button>

<div id="mobileControls">

  <div class="controlSide">
    <button class="control" id="leftBtn">←</button>
    <button class="control" id="rightBtn">→</button>
  </div>

  <div class="controlSide">
    <button class="control jump" id="jumpBtn">↑</button>
  </div>

</div>

<div id="gameOver">

  <div class="gameOverBox">

    <div class="gameOverTitle">
      ИГРА ОКОНЧЕНА
    </div>

    <div class="gameOverScore">
      СЧЁТ
      <strong id="finalScore">0</strong>
    </div>

    <div class="gameOverScore">
      РЕКОРД
      <strong id="finalRecord">0</strong>
    </div>

    <button class="newGame" onclick="startGame()">
      ИГРАТЬ СНОВА
    </button>

    <button class="menuAgain" onclick="goMenu()">
      В МЕНЮ
    </button>

  </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1,2);

function resize(){
  W = innerWidth;
  H = innerHeight;

  canvas.width = W * DPR;
  canvas.height = H * DPR;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================
   GAME STATE
========================= */

let gameRunning = false;
let gameOver = false;

let score = 0;
let coinCount = 0;

let record = Number(localStorage.getItem("ravfmaRecord") || 0);

document.getElementById("menuRecord").textContent = record;


/* =========================
   WORLD
========================= */

const WORLD_WIDTH = 900;
const WORLD_HEIGHT = 9000;

let cameraY = 0;

let platforms = [];
let coins = [];
let particles = [];

let lastTime = 0;


/* =========================
   PLAYER
========================= */

const player = {
  x:450,
  y:WORLD_HEIGHT-250,
  w:38,
  h:60,

  vx:0,
  vy:0,

  speed:4.8,
  jump:14.5,

  grounded:false,
  wallLeft:false,
  wallRight:false,

  facing:1,

  anim:0,
  runAnim:0
};


/* =========================
   CONTROLS
========================= */

const keys = {
  left:false,
  right:false,
  jump:false
};

let jumpPressed = false;

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft" || e.key==="a" || e.key==="A"){
    keys.left=true;
  }

  if(e.key==="ArrowRight" || e.key==="d" || e.key==="D"){
    keys.right=true;
  }

  if(
    e.key==="ArrowUp" ||
    e.key==="w" ||
    e.key==="W" ||
    e.key===" "
  ){
    if(!keys.jump) jumpPressed=true;
    keys.jump=true;
    e.preventDefault();
  }

  if(e.key==="Escape"){
    goMenu();
  }
});

addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft" || e.key==="a" || e.key==="A"){
    keys.left=false;
  }

  if(e.key==="ArrowRight" || e.key==="d" || e.key==="D"){
    keys.right=false;
  }

  if(
    e.key==="ArrowUp" ||
    e.key==="w" ||
    e.key==="W" ||
    e.key===" "
  ){
    keys.jump=false;
  }
});


function buttonControl(id,key){

  const b=document.getElementById(id);

  b.addEventListener("pointerdown",e=>{
    e.preventDefault();

    if(key==="jump"){
      if(!keys.jump) jumpPressed=true;
    }

    keys[key]=true;
  });

  b.addEventListener("pointerup",e=>{
    e.preventDefault();
    keys[key]=false;
  });

  b.addEventListener("pointercancel",()=>{
    keys[key]=false;
  });

  b.addEventListener("pointerleave",()=>{
    keys[key]=false;
  });
}

buttonControl("leftBtn","left");
buttonControl("rightBtn","right");
buttonControl("jumpBtn","jump");


/* =========================
   LEVEL GENERATION
========================= */

function generateLevel(){

  platforms=[];
  coins=[];

  /*
    Нижняя платформа
  */

  platforms.push({
    x:150,
    y:WORLD_HEIGHT-100,
    w:600,
    h:100,
    type:"ground"
  });

  let y=WORLD_HEIGHT-500;

  let lastX=300;

  while(y>300){

    const width=120+Math.random()*150;

    let x=lastX+(Math.random()*300-150);

    x=Math.max(45,Math.min(WORLD_WIDTH-width-45,x));

    platforms.push({
      x,
      y,
      w:width,
      h:28,
      type:"platform"
    });

    /*
      Иногда боковая платформа
    */

    if(Math.random()<.42){

      const secondW=100+Math.random()*120;

      let secondX=x<450
        ? x+width+70
        : x-secondW-70;

      if(secondX>25 && secondX+secondW<WORLD_WIDTH-25){

        platforms.push({
          x:secondX,
          y:y-120-Math.random()*100,
          w:secondW,
          h:28,
          type:"platform"
        });
      }
    }

    /*
      Монета над платформой
    */

    coins.push({
      x:x+width/2,
      y:y-45,
      r:10,
      collected:false,
      spin:Math.random()*Math.PI
    });

    lastX=x;
    y-=260+Math.random()*130;
  }

  /*
    Верхняя финальная площадка
  */

  platforms.push({
    x:300,
    y:300,
    w:300,
    h:35,
    type:"finish"
  });
}


/* =========================
   PARTICLES
========================= */

function spawnParticle(x,y,type="dust",count=6){

  for(let i=0;i<count;i++){

    particles.push({
      x,
      y,

      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.5)*5,

      life:1,

      size:2+Math.random()*5,

      type
    });
  }
}


function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.12;

    p.life-=dt*2.2;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}


/* =========================
   COLLISION
========================= */

function rectCollision(a,b){

  return (
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );
}


/* =========================
   GAME START
========================= */

function startGame(){

  document.getElementById("menu").style.display="none";
  document.getElementById("gameOver").style.display="none";

  document.getElementById("hud").style.display="flex";
  document.getElementById("backButton").style.display="block";

  if("ontouchstart" in window){
    document.getElementById("mobileControls").style.display="flex";
  }

  score=0;
  coinCount=0;

  cameraY=0;

  generateLevel();

  player.x=450;
  player.y=WORLD_HEIGHT-250;

  player.vx=0;
  player.vy=0;

  player.grounded=false;

  particles=[];

  gameRunning=true;
  gameOver=false;

  updateHUD();

  lastTime=performance.now();
  requestAnimationFrame(loop);
}


/* =========================
   MENU
========================= */

function goMenu(){

  gameRunning=false;
  gameOver=false;

  document.getElementById("menu").style.display="flex";
  document.getElementById("gameOver").style.display="none";

  document.getElementById("hud").style.display="none";
  document.getElementById("backButton").style.display="none";
  document.getElementById("mobileControls").style.display="none";

  document.getElementById("menuRecord").textContent=record;
}


function resetRecord(){

  record=0;

  localStorage.setItem("ravfmaRecord","0");

  document.getElementById("menuRecord").textContent="0";
}


/* =========================
   PLAYER PHYSICS
========================= */

function updatePlayer(dt){

  const acceleration=.65;

  if(keys.left){

    player.vx-=acceleration;
    player.facing=-1;

  }else if(keys.right){

    player.vx+=acceleration;
    player.facing=1;

  }else{

    player.vx*=.82;
  }

  player.vx=Math.max(-player.speed,Math.min(player.speed,player.vx));


  /*
    Jump
  */

  if(jumpPressed){

    if(player.grounded){

      player.vy=-player.jump;

      player.grounded=false;

      spawnParticle(
        player.x+player.w/2,
        player.y+player.h,
        "dust",
        10
      );

    }else if(player.wallLeft){

      player.vy=-player.jump*.9;
      player.vx=player.speed*1.4;

      spawnParticle(
        player.x,
        player.y+player.h/2,
        "wall",
        8
      );

    }else if(player.wallRight){

      player.vy=-player.jump*.9;
      player.vx=-player.speed*1.4;

      spawnParticle(
        player.x+player.w,
        player.y+player.h/2,
        "wall",
        8
      );
    }

    jumpPressed=false;
  }


  /*
    Gravity
  */

  player.vy+=.65;

  if(player.vy>16){
    player.vy=16;
  }


  /*
    Horizontal movement
  */

  player.x+=player.vx;


  /*
    World boundaries
  */

  if(player.x<0){

    player.x=0;

    player.vx=0;
  }

  if(player.x+player.w>WORLD_WIDTH){

    player.x=WORLD_WIDTH-player.w;

    player.vx=0;
  }


  /*
    Vertical movement
  */

  const oldY=player.y;

  player.y+=player.vy;

  player.grounded=false;
  player.wallLeft=false;
  player.wallRight=false;


  /*
    Platform collision
  */

  for(const p of platforms){

    /*
      Landing from above
    */

    if(
      player.vy>=0 &&
      oldY+player.h<=p.y &&
      player.y+player.h>=p.y &&
      player.x+player.w>p.x+5 &&
      player.x<p.x+p.w-5
    ){

      player.y=p.y-player.h;

      player.vy=0;

      player.grounded=true;

      if(Math.abs(player.vx)>1.5){

        spawnParticle(
          player.x+player.w/2,
          player.y+player.h,
          "dust",
          2
        );
      }
    }


    /*
      Wall detection
    */

    if(
      player.y+player.h>p.y+4 &&
      player.y<p.y+p.h
    ){

      if(
        player.x+player.w>=p.x &&
        player.x+player.w<=p.x+15
      ){

        player.wallRight=true;
      }

      if(
        player.x<=p.x+p.w &&
        player.x>=p.x+p.w-15
      ){

        player.wallLeft=true;
      }
    }
  }


  /*
    Running animation
  */

  if(Math.abs(player.vx)>.4){

    player.runAnim+=dt*12;

  }else{

    player.runAnim+=dt*3;
  }

  player.anim+=dt;


  /*
    Fall
  */

  if(player.y>WORLD_HEIGHT+500){

    endGame();
  }
}


/* =========================
   COINS
========================= */

function updateCoins(){

  for(const c of coins){

    if(c.collected) continue;

    c.spin+=.08;

    const dx=
      player.x+player.w/2-c.x;

    const dy=
      player.y+player.h/2-c.y;

    const distance=Math.sqrt(dx*dx+dy*dy);

    if(distance<30){

      c.collected=true;

      coinCount++;
      score+=100;

      spawnParticle(
        c.x,
        c.y,
        "coin",
        16
      );

      updateHUD();
    }
  }
}


/* =========================
   SCORE
========================= */

function updateScore(){

  /*
    Чем выше игрок поднялся,
    тем больше очков
  */

  const heightScore=
    Math.max(
      0,
      Math.floor(
        (WORLD_HEIGHT-250-player.y)/10
      )
    );

  if(heightScore>score-coinCount*100){

    score=
      heightScore+
      coinCount*100;
  }

  updateHUD();
}


function updateHUD(){

  document.getElementById("score").textContent=
    score.toLocaleString("ru-RU");

  document.getElementById("coins").textContent=
    coinCount;
}


/* =========================
   CAMERA
========================= */

function updateCamera(){

  /*
    Камера следует за игроком,
    но не дёргается
  */

  const target=
    player.y-H*.55;

  cameraY+=(target-cameraY)*.085;

  const maxCamera=
    WORLD_HEIGHT-H;

  cameraY=Math.max(
    0,
    Math.min(maxCamera,cameraY)
  );
}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

  const gradient=ctx.createLinearGradient(
    0,0,0,H
  );

  gradient.addColorStop(0,"#08090d");
  gradient.addColorStop(.5,"#11131a");
  gradient.addColorStop(1,"#060608");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);


  /*
    вертикальные полосы
  */

  ctx.save();

  const gridSize=90;

  ctx.globalAlpha=.08;

  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=1;

  const offsetX=-(cameraY*.12)%gridSize;

  for(let x=offsetX;x<W;x+=gridSize){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  ctx.restore();


  /*
    световые пятна
  */

  ctx.save();

  ctx.globalAlpha=.08;

  const glow=ctx.createRadialGradient(
    W*.5,
    H*.35,
    10,
    W*.5,
    H*.35,
    H*.75
  );

  glow.addColorStop(0,"#e3b23c");
  glow.addColorStop(1,"transparent");

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);

  ctx.restore();
}


/* =========================
   DRAW PLATFORMS
========================= */

function drawPlatform(p){

  const x=p.x;
  const y=p.y-cameraY;

  /*
    Только рисуем видимую часть
  */

  if(y>H+100 || y<-150) return;

  /*
    Shadow
  */

  ctx.fillStyle="rgba(0,0,0,.4)";

  ctx.fillRect(
    x+5,
    y+8,
    p.w,
    p.h
  );


  /*
    Main block
  */

  const grad=ctx.createLinearGradient(
    x,
    y,
    x,
    y+p.h
  );

  grad.addColorStop(0,"#343434");
  grad.addColorStop(1,"#171717");

  ctx.fillStyle=grad;

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    p.w,
    p.h,
    7
  );

  ctx.fill();


  /*
    Gold upper edge
  */

  ctx.fillStyle=
    p.type==="finish"
      ? "#e3b23c"
      : "#4b4b4b";

  ctx.fillRect(
    x,
    y,
    p.w,
    4
  );


  /*
    small details
  */

  ctx.globalAlpha=.15;

  ctx.fillStyle="#fff";

  for(let i=15;i<p.w;i+=30){

    ctx.fillRect(
      x+i,
      y+10,
      2,
      p.h-15
    );
  }

  ctx.globalAlpha=1;
}


/* =========================
   DRAW COINS
========================= */

function drawCoin(c){

  if(c.collected) return;

  const x=c.x;
  const y=c.y-cameraY;

  if(y<-50 || y>H+50) return;

  const scale=.72+Math.abs(Math.sin(c.spin))*.28;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(scale,1);

  /*
    glow
  */

  ctx.globalAlpha=.2;

  ctx.fillStyle="#e3b23c";

  ctx.beginPath();
  ctx.arc(0,0,18,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=1;

  /*
    coin
  */

  const grad=ctx.createLinearGradient(
    -10,-10,
    10,10
  );

  grad.addColorStop(0,"#fff1a1");
  grad.addColorStop(.3,"#e3b23c");
  grad.addColorStop(1,"#a87513");

  ctx.fillStyle=grad;

  ctx.beginPath();
  ctx.arc(0,0,10,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#fff1a1";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.arc(0,0,7,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

  const x=player.x;
  const y=player.y-cameraY;

  /*
    Shadow
  */

  if(player.grounded){

    ctx.save();

    ctx.globalAlpha=.28;

    ctx.fillStyle="#000";

    ctx.beginPath();

    ctx.ellipse(
      x+player.w/2,
      y+player.h+5,
      25,
      7,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }


  /*
    Animation
  */

  const moving=Math.abs(player.vx)>.5;

  const bob=
    moving
      ? Math.sin(player.runAnim)*2
      : Math.sin(player.anim*2)*1.2;

  const legSwing=
    moving
      ? Math.sin(player.runAnim)*7
      : 0;


  ctx.save();

  ctx.translate(
    x+player.w/2,
    y+bob
  );

  ctx.scale(player.facing,1);


  /*
    Cape/back detail
  */

  ctx.fillStyle="#181818";

  ctx.beginPath();

  ctx.moveTo(-14,-8);
  ctx.lineTo(-26,20);
  ctx.lineTo(-10,17);
  ctx.closePath();

  ctx.fill();


  /*
    Legs
  */

  ctx.strokeStyle="#111";
  ctx.lineWidth=8;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(-7,34);
  ctx.lineTo(-8-legSwing*.35,52);

  ctx.moveTo(7,34);
  ctx.lineTo(8+legSwing*.35,52);

  ctx.stroke();


  /*
    Shoes
  */

  ctx.strokeStyle="#e3b23c";
  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(-10-legSwing*.35,52);
  ctx.lineTo(-2-legSwing*.35,52);

  ctx.moveTo(10+legSwing*.35,52);
  ctx.lineTo(18+legSwing*.35,52);

  ctx.stroke();


  /*
    Body
  */

  const bodyGrad=ctx.createLinearGradient(
    -16,
    0,
    16,
    0
  );

  bodyGrad.addColorStop(0,"#222");
  bodyGrad.addColorStop(.5,"#555");
  bodyGrad.addColorStop(1,"#181818");

  ctx.fillStyle=bodyGrad;

  ctx.beginPath();

  ctx.roundRect(
    -16,
    -5,
    32,
    42,
    10
  );

  ctx.fill();


  /*
    chest stripe
  */

  ctx.fillStyle="#e3b23c";

  ctx.fillRect(
    -14,
    14,
    28,
    4
  );


  /*
    arms
  */

  const armSwing=
    moving
      ? Math.sin(player.runAnim)*8
      : 0;

  ctx.strokeStyle="#292929";
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(-14,4);
  ctx.lineTo(-22,19+armSwing);

  ctx.moveTo(14,4);
  ctx.lineTo(22,19-armSwing);

  ctx.stroke();


  /*
    hands
  */

  ctx.fillStyle="#d8a07a";

  ctx.beginPath();
  ctx.arc(-22,20+armSwing,4,0,Math.PI*2);
  ctx.arc(22,20-armSwing,4,0,Math.PI*2);
  ctx.fill();


  /*
    neck
  */

  ctx.fillStyle="#c98e6a";

  ctx.fillRect(
    -7,
    -13,
    14,
    12
  );


  /*
    head
  */

  const headGrad=ctx.createLinearGradient(
    -17,-34,
    17,-5
  );

  headGrad.addColorStop(0,"#efbd93");
  headGrad.addColorStop(1,"#b56f50");

  ctx.fillStyle=headGrad;

  ctx.beginPath();

  ctx.arc(
    0,
    -25,
    17,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    hair
  */

  ctx.fillStyle="#101010";

  ctx.beginPath();

  ctx.arc(
    0,
    -31,
    17,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillRect(
    -17,
    -31,
    34,
    8
  );


  /*
    face
  */

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(6,-25,2,0,Math.PI*2);
  ctx.fill();


  /*
    jacket collar
  */

  ctx.fillStyle="#e3b23c";

  ctx.beginPath();

  ctx.moveTo(-12,-10);
  ctx.lineTo(-2,1);
  ctx.lineTo(0,-8);
  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(12,-10);
  ctx.lineTo(2,1);
  ctx.lineTo(0,-8);
  ctx.closePath();

  ctx.fill();


  ctx.restore();
}


/* =========================
   PARTICLES DRAW
========================= */

function drawParticles(){

  for(const p of particles){

    const y=p.y-cameraY;

    if(y<-20 || y>H+20) continue;

    ctx.save();

    ctx.globalAlpha=Math.max(0,p.life);

    if(p.type==="coin"){

      ctx.fillStyle="#e3b23c";

    }else if(p.type==="wall"){

      ctx.fillStyle="#ffffff";

    }else{

      ctx.fillStyle="#aaa";
    }

    ctx.beginPath();

    ctx.arc(
      p.x,
      y,
      p.size*p.life,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================
   DRAW
========================= */

function draw(){

  drawBackground();

  ctx.save();

  /*
    world
  */

  for(const p of platforms){

    drawPlatform(p);
  }

  for(const c of coins){

    drawCoin(c);
  }

  drawParticles();

  drawPlayer();

  ctx.restore();


  /*
    top vignette
  */

  const vignette=ctx.createLinearGradient(
    0,0,
    0,H
  );

  vignette.addColorStop(0,"rgba(0,0,0,.35)");
  vignette.addColorStop(.15,"transparent");
  vignette.addColorStop(.85,"transparent");
  vignette.addColorStop(1,"rgba(0,0,0,.35)");

  ctx.fillStyle=vignette;

  ctx.fillRect(0,0,W,H);
}


/* =========================
   GAME LOOP
========================= */

function loop(time){

  if(!gameRunning) return;

  let dt=(time-lastTime)/1000;

  if(dt>.05) dt=.05;

  lastTime=time;

  updatePlayer(dt);
  updateCoins();
  updateScore();
  updateCamera();
  updateParticles(dt);

  draw();

  requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function endGame(){

  if(gameOver) return;

  gameRunning=false;
  gameOver=true;

  if(score>record){

    record=score;

    localStorage.setItem(
      "ravfmaRecord",
      record
    );
  }

  document.getElementById("finalScore").textContent=
    score.toLocaleString("ru-RU");

  document.getElementById("finalRecord").textContent=
    record.toLocaleString("ru-RU");

  document.getElementById("gameOver").style.display="flex";

  document.getElementById("hud").style.display="none";
  document.getElementById("backButton").style.display="none";
  document.getElementById("mobileControls").style.display="none";
}


/* =========================
   STARTUP
========================= */

setTimeout(()=>{

  const loading=document.getElementById("loading");

  loading.style.opacity="0";
  loading.style.transition="opacity .4s";

  setTimeout(()=>{
    loading.remove();
  },450);

},1100);


/* =========================
   PREVENT MOBILE SCROLL
========================= */

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);


/* =========================
   CANVAS INITIAL DRAW
========================= */

generateLevel();
draw();

</script>
