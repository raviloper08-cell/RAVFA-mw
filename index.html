<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
      maximum-scale=1,user-scalable=no,
      viewport-fit=cover">

<title>RAVFMA WM</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd7f2;
  touch-action:none;
  font-family:Arial,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#menu,
#gameOver{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
}

#menu{
  background:
    linear-gradient(
      rgba(12,31,48,.25),
      rgba(12,31,48,.55)
    ),
    linear-gradient(#75c9ee,#d9f5ff);
}

.logo{
  font-size:48px;
  line-height:1;
  font-weight:1000;
  letter-spacing:3px;
  text-shadow:
    3px 4px 0 #202020,
    0 8px 20px rgba(0,0,0,.25);
}

.logo span{
  color:#ffd23f;
}

.subtitle{
  margin-top:12px;
  color:white;
  font-size:14px;
  font-weight:800;
  letter-spacing:4px;
  text-shadow:2px 2px 0 #333;
}

.menuButtons{
  width:min(82vw,320px);
  margin-top:48px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

button{
  min-height:54px;
  border:0;
  border-radius:15px;
  background:#fff;
  color:#202020;
  font-size:17px;
  font-weight:900;
  box-shadow:
    0 5px 0 #b7b7b7,
    0 9px 18px rgba(0,0,0,.18);
}

button:active{
  transform:translateY(4px);
  box-shadow:
    0 1px 0 #aaa,
    0 4px 10px rgba(0,0,0,.15);
}

.primary{
  background:#ffd23f;
  box-shadow:
    0 5px 0 #c09519,
    0 9px 18px rgba(0,0,0,.2);
}

.record{
  margin-top:26px;
  font-weight:800;
  text-shadow:2px 2px 0 #333;
}

.record span{
  color:#ffd23f;
}

#hud{
  position:fixed;
  z-index:10;
  top:calc(env(safe-area-inset-top) + 12px);
  left:12px;
  right:12px;
  display:none;
  justify-content:space-between;
  pointer-events:none;
}

.hudItem{
  padding:8px 12px;
  border-radius:12px;
  background:rgba(20,35,45,.65);
  color:#fff;
  border:2px solid rgba(255,255,255,.25);
  text-shadow:2px 2px 0 #222;
}

.hudLabel{
  font-size:9px;
  font-weight:900;
  opacity:.7;
  letter-spacing:2px;
}

.hudValue{
  margin-top:2px;
  font-size:20px;
  font-weight:1000;
}

#pause{
  position:fixed;
  z-index:11;
  top:calc(env(safe-area-inset-top) + 12px);
  right:12px;
  display:none;
  width:48px;
  min-height:48px;
  padding:0;
  border-radius:50%;
  background:rgba(20,35,45,.7);
  color:#fff;
  box-shadow:none;
  font-size:20px;
}

#controls{
  position:fixed;
  z-index:9;
  inset:auto 0 calc(env(safe-area-inset-bottom) + 15px) 0;
  display:none;
  justify-content:center;
  pointer-events:none;
}

.jumpButton{
  pointer-events:auto;
  width:86px;
  height:86px;
  min-height:86px;
  border-radius:50%;
  background:#ffd23f;
  border:4px solid #fff;
  box-shadow:
    0 5px 0 #b98918,
    0 8px 18px rgba(0,0,0,.25);
  font-size:31px;
}

#gameOver{
  display:none;
  background:rgba(20,32,40,.7);
  backdrop-filter:blur(5px);
}

.overBox{
  width:min(86vw,340px);
  padding:28px 20px;
  text-align:center;
  border-radius:22px;
  background:#fff;
  color:#202020;
  box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.overTitle{
  font-size:30px;
  font-weight:1000;
}

.overScore{
  margin-top:15px;
  color:#777;
}

.overScore strong{
  display:block;
  margin-top:3px;
  color:#202020;
  font-size:40px;
}

.overBox button{
  width:100%;
  margin-top:20px;
}

.overBox .secondary{
  margin-top:10px;
  background:#eee;
  box-shadow:0 4px 0 #bbb;
}

#pauseScreen{
  position:fixed;
  inset:0;
  z-index:19;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
}

.pauseBox{
  width:280px;
  padding:25px;
  border-radius:20px;
  background:white;
  text-align:center;
}

.pauseBox h2{
  margin:0 0 20px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="logo">
    RAVFMA <span>WM</span>
  </div>

  <div class="subtitle">
    WALL CLIMBER
  </div>

  <div class="menuButtons">
    <button class="primary" id="startButton">
      НАЧАТЬ ИГРУ
    </button>

    <button id="resetButton">
      СБРОСИТЬ РЕКОРД
    </button>
  </div>

  <div class="record">
    РЕКОРД:
    <span id="menuRecord">0</span>
  </div>

</div>

<div id="hud">

  <div class="hudItem">
    <div class="hudLabel">СЧЁТ</div>
    <div class="hudValue" id="scoreText">0</div>
  </div>

  <div class="hudItem">
    <div class="hudLabel">МОНЕТЫ</div>
    <div class="hudValue" id="coinText">0</div>
  </div>

</div>

<button id="pause">Ⅱ</button>

<div id="controls">
  <button class="jumpButton" id="jumpButton">↑</button>
</div>

<div id="pauseScreen">

  <div class="pauseBox">
    <h2>ПАУЗА</h2>

    <button id="resumeButton">
      ПРОДОЛЖИТЬ
    </button>

    <button id="pauseMenuButton">
      В МЕНЮ
    </button>
  </div>

</div>

<div id="gameOver">

  <div class="overBox">

    <div class="overTitle">
      GAME OVER
    </div>

    <div class="overScore">
      СЧЁТ
      <strong id="finalScore">0</strong>
    </div>

    <div class="overScore">
      РЕКОРД
      <strong id="finalRecord">0</strong>
    </div>

    <button class="primary" id="restartButton">
      ИГРАТЬ СНОВА
    </button>

    <button class="secondary" id="menuButton">
      В МЕНЮ
    </button>

  </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1,2);

function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR = Math.min(devicePixelRatio || 1,2);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================================================
   DOM
========================================================= */

const menu =
  document.getElementById("menu");

const gameOverScreen =
  document.getElementById("gameOver");

const pauseScreen =
  document.getElementById("pauseScreen");

const hud =
  document.getElementById("hud");

const controls =
  document.getElementById("controls");

const pauseButton =
  document.getElementById("pause");

const scoreText =
  document.getElementById("scoreText");

const coinText =
  document.getElementById("coinText");

const menuRecord =
  document.getElementById("menuRecord");


/* =========================================================
   STORAGE
========================================================= */

let record =
  Number(localStorage.getItem("ravfmaWMRecord") || 0);

menuRecord.textContent = record;


/* =========================================================
   GAME STATE
========================================================= */

let running = false;
let paused = false;

let score = 0;
let coinsCollected = 0;

let worldY = 0;
let highestY = 0;

let level = [];

let coins = [];

let hazards = [];

let particles = [];

let clouds = [];

let cameraY = 0;

let lastTime = 0;

let spawnY = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

  x:0,
  y:0,

  w:38,
  h:58,

  vx:0,
  vy:0,

  side:1,

  rotation:0,

  rotationSpeed:0,

  wallTimer:0,

  grounded:false,

  jumpCount:0,

  squash:1,

  stretch:1,

  alive:true
};


/* =========================================================
   CONSTANTS
========================================================= */

const GRAVITY = 0.58;

const WALL_JUMP_POWER = 12.8;

const AIR_CONTROL = 0.45;

const MAX_FALL = 13;

const WORLD_WIDTH = 700;

const LEFT_WALL = 35;

const RIGHT_WALL = WORLD_WIDTH - 35;


/* =========================================================
   INPUT
========================================================= */

let jumpPressed = false;

const keys = {
  left:false,
  right:false
};

addEventListener("keydown",e=>{

  if(
    e.code==="Space" ||
    e.code==="ArrowUp" ||
    e.code==="KeyW"
  ){

    if(!e.repeat){
      jumpPressed = true;
    }

    e.preventDefault();
  }

  if(e.code==="ArrowLeft" || e.code==="KeyA"){
    keys.left=true;
  }

  if(e.code==="ArrowRight" || e.code==="KeyD"){
    keys.right=true;
  }

  if(e.code==="Escape"){
    togglePause();
  }

});

addEventListener("keyup",e=>{

  if(e.code==="ArrowLeft" || e.code==="KeyA"){
    keys.left=false;
  }

  if(e.code==="ArrowRight" || e.code==="KeyD"){
    keys.right=false;
  }

});


function pressJump(e){

  e.preventDefault();

  if(!running || paused) return;

  jumpPressed=true;
}


document
  .getElementById("jumpButton")
  .addEventListener("pointerdown",pressJump);


/* =========================================================
   MENU EVENTS
========================================================= */

document
  .getElementById("startButton")
  .addEventListener("click",startGame);

document
  .getElementById("restartButton")
  .addEventListener("click",startGame);

document
  .getElementById("menuButton")
  .addEventListener("click",goMenu);

document
  .getElementById("resetButton")
  .addEventListener("click",()=>{

    record=0;

    localStorage.setItem(
      "ravfmaWMRecord",
      "0"
    );

    menuRecord.textContent="0";
  });

pauseButton.addEventListener(
  "click",
  togglePause
);

document
  .getElementById("resumeButton")
  .addEventListener(
    "click",
    togglePause
  );

document
  .getElementById("pauseMenuButton")
  .addEventListener(
    "click",
    goMenu
  );


/* =========================================================
   LEVEL
========================================================= */

function createLevel(){

  level=[];
  coins=[];
  hazards=[];
  particles=[];
  clouds=[];

  /*
    Initial walls.
  */

  level.push({
    x:LEFT_WALL,
    y:-3000,
    w:26,
    h:6000,
    type:"wall"
  });

  level.push({
    x:RIGHT_WALL,
    y:-3000,
    w:26,
    h:6000,
    type:"wall"
  });

  spawnY=400;

  /*
    Start platform.
  */

  level.push({
    x:230,
    y:520,
    w:300,
    h:32,
    type:"platform"
  });

  /*
    Generate vertical obstacles.
  */

  for(let i=0;i<65;i++){

    const y=spawnY-i*170;

    const side =
      Math.random()>.5
        ? "left"
        : "right";

    const width =
      85 + Math.random()*125;

    let x;

    if(side==="left"){

      x=
        LEFT_WALL+30+
        Math.random()*150;

    }else{

      x=
        RIGHT_WALL-width-
        30-
        Math.random()*150;
    }

    level.push({
      x,
      y,
      w:width,
      h:25,
      type:"platform"
    });

    /*
      coin
    */

    if(Math.random()<.8){

      coins.push({

        x:x+width/2,

        y:y-40,

        r:9,

        collected:false,

        spin:Math.random()*6

      });
    }

    /*
      spike
    */

    if(i>3 && Math.random()<.3){

      hazards.push({

        x:
          side==="left"
            ? x+width+20
            : x-45,

        y:y-20,

        w:35,

        h:28,

        side

      });
    }

    /*
      moving platform
    */

    if(i>7 && Math.random()<.2){

      level.push({

        x:150,

        y:y-75,

        w:125,

        h:22,

        type:"moving",

        baseX:150,

        range:220,

        speed:.7+Math.random()*.7,

        phase:Math.random()*6

      });
    }
  }

  /*
    Clouds.
  */

  for(let i=0;i<45;i++){

    clouds.push({

      x:Math.random()*WORLD_WIDTH,

      y:-i*230-Math.random()*100,

      w:70+Math.random()*130,

      h:25+Math.random()*35,

      speed:.1+Math.random()*.2

    });
  }
}


/* =========================================================
   START
========================================================= */

function startGame(){

  menu.style.display="none";
  gameOverScreen.style.display="none";
  pauseScreen.style.display="none";

  hud.style.display="flex";
  pauseButton.style.display="block";
  controls.style.display=
    "flex";

  running=true;
  paused=false;

  score=0;
  coinsCollected=0;

  worldY=0;
  highestY=0;
  cameraY=0;

  createLevel();

  player.x=450;
  player.y=440;

  player.vx=0;
  player.vy=-WALL_JUMP_POWER;

  player.side=1;

  player.rotation=0;
  player.rotationSpeed=0;

  player.wallTimer=0;
  player.grounded=false;
  player.alive=true;

  updateHUD();

  lastTime=performance.now();

  requestAnimationFrame(loop);
}


/* =========================================================
   MENU
========================================================= */

function goMenu(){

  running=false;
  paused=false;

  menu.style.display="flex";
  gameOverScreen.style.display="none";
  pauseScreen.style.display="none";

  hud.style.display="none";
  pauseButton.style.display="none";
  controls.style.display="none";

  menuRecord.textContent=record;
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

  if(!running) return;

  paused=!paused;

  pauseScreen.style.display=
    paused ? "flex" : "none";

  if(!paused){

    lastTime=performance.now();

    requestAnimationFrame(loop);
  }
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

  /*
    Automatic wall jump behaviour.
  */

  if(player.wallTimer>0){

    player.wallTimer-=dt;
  }

  /*
    horizontal controls
  */

  if(keys.left){
    player.vx-=AIR_CONTROL;
  }

  if(keys.right){
    player.vx+=AIR_CONTROL;
  }

  player.vx*=.93;

  player.vx=
    Math.max(
      -5,
      Math.min(5,player.vx)
    );


  /*
    gravity
  */

  player.vy+=GRAVITY;

  if(player.vy>MAX_FALL){
    player.vy=MAX_FALL;
  }

  /*
    movement
  */

  player.x+=player.vx;
  player.y+=player.vy;


  /*
    walls
  */

  if(
    player.x<=LEFT_WALL+26
  ){

    player.x=LEFT_WALL+26;

    if(
      player.vy>0 &&
      player.wallTimer<=0
    ){

      wallKick(-1);
    }
  }


  if(
    player.x+player.w>=RIGHT_WALL
  ){

    player.x=
      RIGHT_WALL-player.w;

    if(
      player.vy>0 &&
      player.wallTimer<=0
    ){

      wallKick(1);
    }
  }


  /*
    platforms
  */

  player.grounded=false;

  for(const p of level){

    if(
      p.type==="wall"
    ) continue;

    if(
      p.type==="moving"
    ){

      p.x=
        p.baseX+
        Math.sin(
          performance.now()/1000*
          p.speed+
          p.phase
        )*p.range;
    }

    if(

      player.vy>=0 &&

      player.y+
      player.h >=
      p.y &&

      player.y+
      player.h-
      player.vy <=
      p.y &&

      player.x+
      player.w >
      p.x &&

      player.x <
      p.x+p.w

    ){

      player.y=
        p.y-player.h;

      player.vy=
        -WALL_JUMP_POWER;

      player.grounded=true;

      player.rotationSpeed=0;

      player.rotation=0;

      spawnDust(
        player.x+
        player.w/2,
        player.y+
        player.h
      );
    }
  }


  /*
    Manual jump/backflip.
  */

  if(jumpPressed){

    jumpPressed=false;

    /*
      jump from wall
    */

    if(
      player.x<=
      LEFT_WALL+34
    ){

      wallKick(-1);

    }else if(
      player.x+
      player.w>=
      RIGHT_WALL-5
    ){

      wallKick(1);

    }else{

      /*
        mid-air flip
      */

      player.vy=
        -WALL_JUMP_POWER*.9;

      player.rotationSpeed=
        player.side===1
          ? -0.23
          : 0.23;
    }
  }


  /*
    flip rotation
  */

  player.rotation+=
    player.rotationSpeed;

  player.rotationSpeed*=.985;

  /*
    landing reset
  */

  if(player.grounded){

    player.rotationSpeed=0;

    player.rotation*=.75;
  }


  /*
    height
  */

  if(player.y<highestY){

    highestY=player.y;

    score=
      Math.max(
        score,
        Math.floor(
          (440-highestY)/4
        )+
        coinsCollected*100
      );
  }


  /*
    death by falling
  */

  if(
    player.y-
    cameraY>
    H+180
  ){

    endGame();
  }
}


/* =========================================================
   WALL KICK
========================================================= */

function wallKick(side){

  /*
    side -1 = left wall
    side 1 = right wall
  */

  player.side=side;

  player.vy=
    -WALL_JUMP_POWER;

  player.vx=
    side===-1
      ? 5.5
      : -5.5;

  player.wallTimer=.16;

  player.rotationSpeed=
    side===-1
      ? .17
      : -.17;

  spawnJumpParticles(
    player.x+
      (side===-1
        ? 0
        : player.w),
    player.y+
      player.h/2
  );
}


/* =========================================================
   COINS
========================================================= */

function updateCoins(){

  for(const c of coins){

    if(c.collected) continue;

    c.spin+=.09;

    const dx=
      player.x+
      player.w/2-
      c.x;

    const dy=
      player.y+
      player.h/2-
      c.y;

    if(
      Math.sqrt(dx*dx+dy*dy)
      <28
    ){

      c.collected=true;

      coinsCollected++;

      score+=100;

      spawnCoinParticles(
        c.x,
        c.y
      );

      updateHUD();
    }
  }
}


/* =========================================================
   HAZARDS
========================================================= */

function updateHazards(){

  for(const h of hazards){

    if(
      player.x+
      player.w-
      5 >
      h.x &&

      player.x+
      5 <
      h.x+h.w &&

      player.y+
      player.h-
      5 >
      h.y &&

      player.y+
      5 <
      h.y+h.h
    ){

      endGame();
      return;
    }
  }
}


/* =========================================================
   PARTICLES
========================================================= */

function spawnDust(x,y){

  for(let i=0;i<7;i++){

    particles.push({

      x:x,

      y:y,

      vx:(Math.random()-.5)*3,

      vy:-Math.random()*2,

      size:2+
        Math.random()*4,

      life:1,

      color:"#fff"

    });
  }
}


function spawnJumpParticles(x,y){

  for(let i=0;i<10;i++){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5)*4,

      vy:
        (Math.random()-.5)*4,

      size:
        2+
        Math.random()*4,

      life:1,

      color:"#fff"

    });
  }
}


function spawnCoinParticles(x,y){

  for(let i=0;i<15;i++){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5)*5,

      vy:
        (Math.random()-.5)*5,

      size:
        2+
        Math.random()*4,

      life:1,

      color:"#ffd23f"

    });
  }
}


function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.08;

    p.life-=dt*2.4;

    if(p.life<=0){

      particles.splice(i,1);
    }
  }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const target=
    player.y-
    H*.38;

  cameraY+=
    (target-cameraY)*.09;

  /*
    Camera only moves upward.
  */

  if(cameraY>0){
    cameraY=0;
  }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  scoreText.textContent=
    Math.max(
      0,
      Math.floor(score)
    ).toLocaleString("ru-RU");

  coinText.textContent=
    coinsCollected;
}


/* =========================================================
   DRAW SKY
========================================================= */

function drawBackground(){

  const gradient=
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  gradient.addColorStop(
    0,
    "#65bfe9"
  );

  gradient.addColorStop(
    .65,
    "#bdebf8"
  );

  gradient.addColorStop(
    1,
    "#effbff"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    distant city.
  */

  ctx.save();

  ctx.globalAlpha=.13;

  const base=
    H*.72;

  ctx.fillStyle="#487c91";

  for(
    let x=-20;
    x<W+40;
    x+=45
  ){

    const bh=
      50+
      Math.abs(
        Math.sin(x*1.3)
      )*100;

    ctx.fillRect(
      x,
      base-bh,
      35,
      bh
    );
  }

  ctx.restore();


  /*
    clouds.
  */

  ctx.save();

  ctx.globalAlpha=.42;

  for(const c of clouds){

    const x=
      ((c.x-
        cameraY*c.speed)
       % WORLD_WIDTH+
       WORLD_WIDTH)
      %WORLD_WIDTH;

    const y=
      c.y-cameraY*.35;

    if(
      y<-100 ||
      y>H+100
    ) continue;

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.ellipse(
      x,
      y,
      c.w*.5,
      c.h*.5,
      0,0,
      Math.PI*2
    );

    ctx.ellipse(
      x-c.w*.22,
      y+4,
      c.w*.3,
      c.h*.38,
      0,0,
      Math.PI*2
    );

    ctx.ellipse(
      x+c.w*.22,
      y+3,
      c.w*.32,
      c.h*.4,
      0,0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   DRAW WALL
========================================================= */

function drawWall(p){

  const y=p.y-cameraY;

  if(
    y>H+100 ||
    y<-100
  ) return;

  /*
    main wall
  */

  const gradient=
    ctx.createLinearGradient(
      p.x,
      y,
      p.x+p.w,
      y
    );

  gradient.addColorStop(
    0,
    "#4d5358"
  );

  gradient.addColorStop(
    .5,
    "#7d8588"
  );

  gradient.addColorStop(
    1,
    "#3b4044"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    p.x,
    y,
    p.w,
    p.h
  );


  /*
    bricks
  */

  ctx.strokeStyle=
    "rgba(0,0,0,.22)";

  ctx.lineWidth=2;

  const brickH=23;

  for(
    let yy=y;
    yy<y+p.h;
    yy+=brickH
  ){

    ctx.beginPath();

    ctx.moveTo(
      p.x,
      yy
    );

    ctx.lineTo(
      p.x+p.w,
      yy
    );

    ctx.stroke();

    const offset=
      Math.floor(
        (yy-y)/brickH
      )%2
      ? 13
      : 0;

    for(
      let xx=
        p.x+offset;
      xx<p.x+p.w;
      xx+=26
    ){

      ctx.beginPath();

      ctx.moveTo(
        xx,
        yy
      );

      ctx.lineTo(
        xx,
        yy+brickH
      );

      ctx.stroke();
    }
  }
}


/* =========================================================
   DRAW PLATFORM
========================================================= */

function drawPlatform(p){

  const y=p.y-cameraY;

  if(
    y>H+80 ||
    y<-80
  ) return;

  let top="#e8e8e8";

  if(p.type==="moving"){
    top="#ffd23f";
  }

  /*
    shadow
  */

  ctx.fillStyle=
    "rgba(0,0,0,.22)";

  ctx.fillRect(
    p.x+4,
    y+6,
    p.w,
    p.h
  );


  /*
    body
  */

  ctx.fillStyle=
    "#62696d";

  ctx.fillRect(
    p.x,
    y,
    p.w,
    p.h
  );


  /*
    top
  */

  ctx.fillStyle=top;

  ctx.fillRect(
    p.x,
    y,
    p.w,
    7
  );


  /*
    texture
  */

  ctx.fillStyle=
    "rgba(255,255,255,.16)";

  for(
    let x=p.x+10;
    x<p.x+p.w;
    x+=22
  ){

    ctx.fillRect(
      x,
      y+11,
      10,
      3
    );
  }
}


/* =========================================================
   DRAW SPIKES
========================================================= */

function drawHazard(h){

  const y=h.y-cameraY;

  if(
    y>H+80 ||
    y<-80
  ) return;

  ctx.fillStyle="#d83d35";

  const count=4;

  const sw=h.w/count;

  for(let i=0;i<count;i++){

    ctx.beginPath();

    ctx.moveTo(
      h.x+i*sw,
      y+h.h
    );

    ctx.lineTo(
      h.x+i*sw+sw/2,
      y
    );

    ctx.lineTo(
      h.x+(i+1)*sw,
      y+h.h
    );

    ctx.closePath();

    ctx.fill();
  }

  ctx.fillStyle="#a82220";

  ctx.fillRect(
    h.x,
    y+h.h-5,
    h.w,
    5
  );
}


/* =========================================================
   DRAW COIN
========================================================= */

function drawCoin(c){

  if(c.collected) return;

  const y=
    c.y-cameraY;

  if(
    y<-40 ||
    y>H+40
  ) return;

  const sx=
    Math.max(
      .2,
      Math.abs(
        Math.cos(c.spin)
      )
    );

  ctx.save();

  ctx.translate(
    c.x,
    y
  );

  ctx.scale(
    sx,
    1
  );

  /*
    glow
  */

  ctx.globalAlpha=.18;

  ctx.fillStyle="#ffd23f";

  ctx.beginPath();

  ctx.arc(
    0,0,
    18,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;


  /*
    coin
  */

  ctx.fillStyle="#ffd23f";

  ctx.beginPath();

  ctx.arc(
    0,0,
    10,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#c49218";

  ctx.lineWidth=3;

  ctx.stroke();


  ctx.fillStyle="#fff2a1";

  ctx.font=
    "bold 12px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "★",
    0,
    1
  );

  ctx.restore();
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

  const x=
    player.x+
    player.w/2;

  const y=
    player.y+
    player.h/2-
    cameraY;

  /*
    don't draw outside
  */

  if(
    y<-100 ||
    y>H+100
  ) return;


  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    player.rotation
  );


  /*
    shadow
  */

  ctx.save();

  ctx.globalAlpha=.2;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    0,
    32,
    22,
    6,
    0,0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /*
    legs
  */

  const legSwing=
    Math.sin(
      performance.now()/75
    )*5;

  ctx.strokeStyle="#272727";

  ctx.lineWidth=7;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    -7,
    18
  );

  ctx.lineTo(
    -10+legSwing,
    32
  );

  ctx.moveTo(
    7,
    18
  );

  ctx.lineTo(
    10-legSwing,
    32
  );

  ctx.stroke();


  /*
    shoes
  */

  ctx.strokeStyle="#161616";

  ctx.lineWidth=8;

  ctx.beginPath();

  ctx.moveTo(
    -14+legSwing,
    32
  );

  ctx.lineTo(
    -3+legSwing,
    32
  );

  ctx.moveTo(
    3-legSwing,
    32
  );

  ctx.lineTo(
    14-legSwing,
    32
  );

  ctx.stroke();


  /*
    body
  */

  ctx.fillStyle="#27323a";

  ctx.beginPath();

  ctx.roundRect(
    -15,
    -9,
    30,
    32,
    8
  );

  ctx.fill();


  /*
    shirt
  */

  ctx.fillStyle="#4c6774";

  ctx.fillRect(
    -10,
    -5,
    20,
    19
  );


  /*
    belt
  */

  ctx.fillStyle="#ffd23f";

  ctx.fillRect(
    -14,
    12,
    28,
    4
  );


  /*
    arms
  */

  const arm=
    Math.sin(
      performance.now()/80
    )*7;

  ctx.strokeStyle="#263139";

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    -14,
    -2
  );

  ctx.lineTo(
    -22,
    12+arm
  );

  ctx.moveTo(
    14,
    -2
  );

  ctx.lineTo(
    22,
    12-arm
  );

  ctx.stroke();


  /*
    hands
  */

  ctx.fillStyle="#d4936c";

  ctx.beginPath();

  ctx.arc(
    -22,
    12+arm,
    4,
    0,
    Math.PI*2
  );

  ctx.arc(
    22,
    12-arm,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    neck
  */

  ctx.fillStyle="#d4936c";

  ctx.fillRect(
    -6,
    -16,
    12,
    10
  );


  /*
    head
  */

  ctx.fillStyle="#d99a73";

  ctx.beginPath();

  ctx.arc(
    0,
    -23,
    16,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    hair
  */

  ctx.fillStyle="#242424";

  ctx.beginPath();

  ctx.arc(
    0,
    -29,
    16,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillRect(
    -16,
    -30,
    32,
    7
  );


  /*
    eye
  */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    6,
    -23,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    face line
  */

  ctx.strokeStyle="#a95f4d";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    5,
    -17
  );

  ctx.lineTo(
    9,
    -17
  );

  ctx.stroke();


  /*
    backpack
  */

  ctx.fillStyle="#1d252b";

  ctx.roundRect(
    -20,
    -8,
    7,
    22,
    3
  );

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   PARTICLES DRAW
========================================================= */

function drawParticles(){

  for(const p of particles){

    const y=
      p.y-cameraY;

    if(
      y<-20 ||
      y>H+20
    ) continue;

    ctx.globalAlpha=
      Math.max(0,p.life);

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   DRAW WORLD
========================================================= */

function draw(){

  drawBackground();


  /*
    world transform
  */

  for(const p of level){

    if(p.type==="wall"){

      drawWall(p);

    }else{

      drawPlatform(p);
    }
  }


  for(const h of hazards){

    drawHazard(h);
  }


  for(const c of coins){

    drawCoin(c);
  }


  drawParticles();

  drawPlayer();


  /*
    vignette
  */

  const vignette=
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  vignette.addColorStop(
    0,
    "rgba(0,0,0,.16)"
  );

  vignette.addColorStop(
    .18,
    "transparent"
  );

  vignette.addColorStop(
    .8,
    "transparent"
  );

  vignette.addColorStop(
    1,
    "rgba(0,0,0,.2)"
  );

  ctx.fillStyle=vignette;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(!running) return;

  running=false;

  player.alive=false;

  if(score>record){

    record=Math.floor(score);

    localStorage.setItem(
      "ravfmaWMRecord",
      String(record)
    );
  }

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(score)
      .toLocaleString("ru-RU");

  document.getElementById(
    "finalRecord"
  ).textContent=
    record
      .toLocaleString("ru-RU");

  menuRecord.textContent=record;

  gameOverScreen.style.display="flex";

  hud.style.display="none";

  pauseButton.style.display="none";

  controls.style.display="none";
}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(time){

  if(!running || paused) return;

  let dt=
    (time-lastTime)/1000;

  if(dt>0.04){
    dt=0.04;
  }

  lastTime=time;

  updatePlayer(dt);
  updateCoins();
  updateHazards();
  updateParticles(dt);
  updateCamera();
  updateHUD();

  draw();

  requestAnimationFrame(loop);
}


/* =========================================================
   INITIAL DRAW
========================================================= */

createLevel();

player.x=450;
player.y=440;

draw();

</script>
